
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-sans); background: linear-gradient(135deg, #E6F1FB 0%, #FBEAF0 100%); }
.wrapper { padding: 16px; }
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.header p { font-size: 13px; color: var(--color-text-secondary); }
.main-container { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.toolbar { display: flex; gap: 6px; padding: 12px; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); flex-wrap: wrap; }
.toolbar button { padding: 6px 14px; font-size: 12px; cursor: pointer; border-radius: 16px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); color: var(--color-text-primary); transition: all 0.2s; }
.toolbar button:hover { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); transform: translateY(-1px); }
.toolbar button:active { transform: translateY(0); }
.content-area { display: flex; height: 520px; }
.editor-pane { flex: 1; background: var(--color-background-secondary); border-right: 0.5px solid var(--color-border-tertiary); position: relative; }
.preview-pane { flex: 1; background: white; overflow: auto; position: relative; }
.pane-label { position: absolute; top: 8px; left: 12px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); background: var(--color-background-primary); padding: 4px 10px; border-radius: 12px; border: 0.5px solid var(--color-border-tertiary); z-index: 10; }
textarea { width: 100%; height: 100%; border: none; outline: none; resize: none; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; padding: 40px 16px 16px 16px; background: transparent; color: var(--color-text-primary); }
.preview-frame { width: 100%; height: 100%; border: none; padding-top: 32px; }
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: var(--color-background-secondary); border-top: 0.5px solid var(--color-border-tertiary); font-size: 11px; color: var(--color-text-secondary); }
.status-item { display: flex; align-items: center; gap: 6px; }
.emoji { font-size: 14px; }
</style>

<div class="wrapper">
  <div class="header">
    <h1>✨ HTML Live Editor ✨</h1>
    <p>コードを書いたらすぐにプレビュー！</p>
  </div>

  <div class="main-container">
    <div class="toolbar">
      <button onclick="insertTag('h1', 'タイトル')">📝 見出し</button>
      <button onclick="insertTag('p', 'テキスト')">💬 段落</button>
      <button onclick="insertTag('div', 'コンテンツ')">📦 div</button>
      <button onclick="insertTag('button', 'ボタン')">🔘 ボタン</button>
      <button onclick="insertTag('input', '')">⌨️ 入力欄</button>
      <button onclick="insertTag('img src=&quot;&quot; alt=&quot;画像&quot;', '', true)">🖼️ 画像</button>
      <button onclick="insertStyle()">🎨 スタイル</button>
      <button onclick="insertScript()">⚡ スクリプト</button>
      <button onclick="clearAll()">🗑️ クリア</button>
      <button onclick="copyCode()">📋 コピー</button>
    </div>

    <div class="content-area">
      <div class="editor-pane">
        <div class="pane-label">✏️ コード</div>
        <textarea id="editor" spellcheck="false"><!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href=manifest.json">
  <meta name="theme-color" content="#667eea">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }
    .card {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 400px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px 0;
      color: #666;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌈 Hello, World!</h1>
    <p>HTMLライブエディタへようこそ</p>
    <button onclick="alert('素敵！✨')">クリックしてね</button>
  </div>
</body>
</html></textarea>
      </div>
      <div class="preview-pane">
        <div class="pane-label">👀 プレビュー</div>
        <iframe id="preview" class="preview-frame"></iframe>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-item">
        <span class="emoji">💡</span>
        <span>リアルタイムプレビュー有効</span>
      </div>
      <div class="status-item">
        <span id="lineCount">行数: 0</span>
      </div>
    </div>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const lineCount = document.getElementById('lineCount');

function updatePreview() {
  const code = editor.value;
  const previewDoc = preview.contentDocument || preview.contentWindow.document;
  previewDoc.open();
  previewDoc.write(code);
  previewDoc.close();
  
  const lines = code.split('\n').length;
  lineCount.textContent = `行数: ${lines}`;
}

editor.addEventListener('input', updatePreview);

function insertTag(tag, content, selfClosing = false) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const text = editor.value;
  const selectedText = text.substring(start, end);
  
  let insertion;
  if (selfClosing) {
    insertion = `<${tag}>`;
  } else {
    insertion = `<${tag}>${selectedText || content}</${tag.split(' ')[0]}>`;
  }
  
  const newText = text.substring(0, start) + insertion + text.substring(end);
  editor.value = newText;
  editor.focus();
  
  if (!selfClosing) {
    const cursorPos = start + tag.length + 2;
    editor.setSelectionRange(cursorPos, cursorPos + (selectedText || content).length);
  }
  
  updatePreview();
}

function insertStyle() {
  const styleBlock = `<style>\n  /* ここにCSSを書く */\n  \n</style>`;
  insertAtCursor(styleBlock);
}

function insertScript() {
  const scriptBlock = `<script>\n  // ここにJavaScriptを書く\n  \n<\/script>`;
  insertAtCursor(scriptBlock);
}

function insertAtCursor(text) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const current = editor.value;
  editor.value = current.substring(0, start) + text + current.substring(end);
  editor.focus();
  editor.setSelectionRange(start + text.length, start + text.length);
  updatePreview();
}

function clearAll() {
  if (confirm('すべてのコードをクリアしますか？ 🗑️')) {
    editor.value = '<!DOCTYPE html>\n<html lang="ja">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Document</title>\n</head>\n<body>\n  \n</body>\n</html>';
    updatePreview();
    editor.focus();
  }
}

function copyCode() {
  editor.select();
  document.execCommand('copy');
  alert('コードをコピーしました！ 📋✨');
  editor.setSelectionRange(editor.value.length, editor.value.length);
}

updatePreview();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js')
  .then(() => console.log('Service Worker Registrerd'));
}
</script>
